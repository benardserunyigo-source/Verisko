name: Android Field pilot APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256 -o "$RUNNER_TEMP/gradle.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Test, lint and build APK
        working-directory: android-field
        run: '"$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon testDebugUnitTest lintDebug assembleDebug'
      - name: Verify APK signature and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-field/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-field/app/build/outputs/apk/debug/app-debug.apk > android-field/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload pilot APK and checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Verisko-Field-Android-pilot
          path: |
            android-field/app/build/outputs/apk/debug/app-debug.apk
            android-field/app/build/outputs/apk/debug/SHA256SUMS.txt
            android-field/app/build/reports/tests/testDebugUnitTest/
            android-field/app/build/reports/lint-results-debug.html
          retention-days: 14
