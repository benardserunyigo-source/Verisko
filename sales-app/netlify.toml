[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200

[[redirects]]
  from = "/api/sales-prices"
  to = "/.netlify/functions/sales-prices"
  status = 200

[[redirects]]
  from = "/api/draft-costs"
  to = "/.netlify/functions/draft-costs"
  status = 200

[[redirects]]
  from = "/api/client-plan"
  to = "/.netlify/functions/client-plan"
  status = 200

[[redirects]]
  from = "/api/client-work"
  to = "/.netlify/functions/client-work"
  status = 200

[[redirects]]
  from = "/api/voice-notes"
  to = "/.netlify/functions/voice-notes"
  status = 200

[[redirects]]
  from = "/api/ready-leads"
  to = "/.netlify/functions/ready-leads"
  status = 200

[[redirects]]
  from = "/api/installer"
  to = "/.netlify/functions/installer"
  status = 200

[[redirects]]
  from = "/api/field-shifts"
  to = "/.netlify/functions/field-shifts"
  status = 200

[[redirects]]
  from = "/api/applications"
  to = "/.netlify/functions/applications"
  status = 200

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/receipt"
  to = "/.netlify/functions/receipt"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/export"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self)"

[[headers]]
  for = "/apply*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/client-plan*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
