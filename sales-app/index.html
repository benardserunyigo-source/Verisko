<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#012169">
  <meta name="description" content="Verisko Uganda Operations — prospects, site visits, cash flow and commissions for the Verisko field team.">
  <title>Verisko Uganda Operations</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Verisko">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="app.css?v=123">
  <link rel="modulepreload" href="field-shifts-tracker.mjs?v=123">
  <link rel="modulepreload" href="field-shifts-ui.mjs?v=123">
  <link rel="modulepreload" href="field-shifts-android.mjs?v=123">
  <link rel="modulepreload" href="installer-ui.mjs?v=123">
  <link rel="modulepreload" href="installer-client.mjs?v=123">
  <link rel="modulepreload" href="installer-model.mjs?v=123">
  <link rel="modulepreload" href="installer-materials.mjs?v=123">
  <link rel="modulepreload" href="installer-demo.mjs?v=123">
</head>
<body class="locked">
  <div id="lockScreen" class="lockscreen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-card" id="lockCard"><!-- rendered by app.js --></div>
  </div>

  <div id="onboarding" class="lockscreen" role="dialog" aria-modal="true" aria-label="Welcome tour" hidden>
    <div class="lock-card onb-card" id="onbCard"><!-- rendered by app.js --></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#today" aria-label="Verisko Uganda Operations — go to Home">
      <img class="brand-mark" src="logo.svg" alt="" width="28" height="28">
      <span class="brand-name">Verisko</span>
    </a>
    <button class="user-chip" id="userChip" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Your account" hidden>
      <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
    </button>
  </header>

  <div class="user-menu" id="userMenu" role="menu" hidden>
    <div class="user-menu-head">
      <span class="user-avatar lg" id="userMenuAvatar" aria-hidden="true"></span>
      <div class="user-menu-id">
        <strong id="userMenuName"></strong>
        <span id="userMenuEmail"></span>
      </div>
    </div>
    <p class="sync-state" id="syncState" data-state="local">
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="sync-text" id="syncText">Saved on this device</span>
    </p>
    <button class="btn btn-ghost btn-block" type="button" data-role-preview hidden>Preview a team role</button>
    <button class="btn btn-ghost btn-block" type="button" data-howto>How it works</button>
    <button class="btn btn-danger btn-block" type="button" data-logout>Log out</button>
  </div>

  <div class="app-shell">
    <nav class="mainnav" aria-label="Primary">
      <button class="nav-item" type="button" data-section="home" aria-label="Home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v10h-6v-7H9v7H3Z"/></svg><span class="nav-label">Home</span></button>
      <button class="nav-item" type="button" data-section="contacts" aria-label="Contacts"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></svg><span class="nav-label">Contacts</span></button>
      <button class="nav-item" type="button" data-section="work" aria-label="Jobs"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 13h18"/></svg><span class="nav-label">Jobs</span></button>
      <button class="nav-item" type="button" data-section="more" aria-label="More"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="nav-label">More</span></button>
      <p class="nav-note">Your work, one step at a time.</p>
    </nav>

    <main id="main" tabindex="-1">
      <div id="fieldShiftBanner" class="field-shift-banner" hidden></div>
      <nav id="sectionNav" class="section-nav" aria-label="Home pages"></nav>
      <div class="page-head">
        <div class="page-head-text">
          <p class="eyebrow" id="pageEyebrow">Your work today</p>
          <h1 id="pageTitle">Today</h1>
          <p class="page-sub" id="pageIntro">Your day at a glance.</p>
        </div>
        <button class="btn btn-primary page-action" id="primaryAction" type="button" aria-label="Add prospect">
          <span class="page-action-plus" aria-hidden="true">+</span>
          <span class="page-action-label">Add prospect</span>
        </button>
      </div>
      <section id="viewContent"></section>
    </main>
  </div>

  <dialog id="recordDialog" aria-labelledby="dialogTitle">
    <form id="recordForm">
      <header class="dialog-head">
        <div>
          <p class="eyebrow" id="dialogEyebrow">New record</p>
          <h2 id="dialogTitle">Add prospect</h2>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close without saving">×</button>
      </header>
      <p class="form-error" id="formError" role="alert" hidden></p>
      <div id="formContent"></div>
      <footer class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveButton">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="askDialog" class="ask-dialog" aria-labelledby="askTitle"><!-- rendered by app.js --></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importInput" accept=".json,application/json" hidden>
  <input type="file" id="leadImportInput" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
  <script src="cashflow-report.js?v=123"></script>
  <script src="price-catalogue.js?v=123"></script>
  <script src="offer-catalogue.js?v=123"></script>
  <script src="job-finance.js?v=123"></script>
  <script src="care-policy.js?v=123"></script>
  <script src="pricing.js?v=123"></script>
  <script src="quote-pdf.js?v=123"></script>
  <script src="closed-sales.js?v=123"></script>
  <script src="commission.js?v=123"></script>
  <script src="sales-pay-policy.js?v=123"></script>
  <script src="lead-import.js?v=123"></script>
  <script src="lead-qualify.js?v=123"></script>
  <script src="lead-pipeline.js?v=123"></script>
  <script src="booking.js?v=123"></script>
  <script src="support-content.js?v=123"></script>
  <script src="certificate.js?v=123"></script>
  <script src="role-preview.js?v=123"></script>
  <script src="navigation.js?v=123"></script>
  <script src="app.js?v=123"></script>
</body>
</html>
