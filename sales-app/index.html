<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#012169">
  <meta name="description" content="Verisko Uganda Operations — prospects, site visits, cash flow and commissions for the Verisko field team.">
  <title>Verisko Uganda Operations</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="stylesheet" href="app.css?v=42">
</head>
<body class="locked">
  <div id="lockScreen" class="lockscreen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-card" id="lockCard"><!-- rendered by app.js --></div>
  </div>

  <div id="onboarding" class="lockscreen" role="dialog" aria-modal="true" aria-label="Welcome tour" hidden>
    <div class="lock-card onb-card" id="onbCard"><!-- rendered by app.js --></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#today" aria-label="Verisko Uganda Operations — go to Today">
      <img class="brand-mark" src="logo.svg" alt="" width="28" height="28">
      <span class="brand-name">Verisko</span>
    </a>
    <button class="user-chip" id="userChip" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Your account" hidden>
      <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
    </button>
  </header>

  <div class="user-menu" id="userMenu" role="menu" hidden>
    <div class="user-menu-head">
      <span class="user-avatar lg" id="userMenuAvatar" aria-hidden="true"></span>
      <div class="user-menu-id">
        <strong id="userMenuName"></strong>
        <span id="userMenuEmail"></span>
      </div>
    </div>
    <p class="sync-state" id="syncState" data-state="local">
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="sync-text" id="syncText">Saved on this device</span>
    </p>
    <button class="btn btn-ghost btn-block" type="button" data-howto>How it works</button>
    <button class="btn btn-danger btn-block" type="button" data-logout>Log out</button>
  </div>

  <div class="app-shell">
    <nav class="mainnav" aria-label="Primary">
      <button class="nav-item is-active" type="button" data-view="today" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v3M16 3v3"/><path d="M8.5 14.5l2.2 2.2 4.3-4.6"/></svg>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item" type="button" data-view="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/></svg>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-item" type="button" data-view="prospects">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 3-5 5.5-5s4.9 1.8 5.5 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M17.5 19c-.2-1.9-1-3.4-2.2-4.4"/></svg>
        <span class="nav-label">Prospects</span>
        <span class="nav-badge" id="prospectBadge" hidden aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-view="visits">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <span class="nav-label">Visits</span>
      </button>
      <button class="nav-item" type="button" data-view="jobs" hidden>
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M3 12h18"/></svg>
        <span class="nav-label">Jobs</span>
      </button>
      <button class="nav-item" type="button" data-view="cashflow" hidden>
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.4"/></svg>
        <span class="nav-label">Cash flow</span>
        <span class="nav-badge" id="cashBadge" hidden aria-hidden="true"></span>
      </button>
      <button class="nav-item" type="button" data-more hidden aria-label="More">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        <span class="nav-label">More</span>
      </button>
      <button class="nav-item" type="button" data-view="settings" hidden>
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">Settings</span>
      </button>
      <p class="nav-note">Verisko Uganda Operations — one connected place for the whole team.</p>
    </nav>

    <main id="main" tabindex="-1">
      <div class="page-head">
        <div class="page-head-text">
          <p class="eyebrow" id="pageEyebrow">Your work today</p>
          <h1 id="pageTitle">Today</h1>
          <p class="page-sub" id="pageIntro">Your day at a glance.</p>
        </div>
        <button class="btn btn-primary page-action" id="primaryAction" type="button" aria-label="Add prospect">
          <span class="page-action-plus" aria-hidden="true">+</span>
          <span class="page-action-label">Add prospect</span>
        </button>
      </div>
      <section id="viewContent"></section>
    </main>
  </div>

  <dialog id="recordDialog" aria-labelledby="dialogTitle">
    <form id="recordForm">
      <header class="dialog-head">
        <div>
          <p class="eyebrow" id="dialogEyebrow">New record</p>
          <h2 id="dialogTitle">Add prospect</h2>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close without saving">×</button>
      </header>
      <p class="form-error" id="formError" role="alert" hidden></p>
      <div id="formContent"></div>
      <footer class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveButton">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="askDialog" class="ask-dialog" aria-labelledby="askTitle"><!-- rendered by app.js --></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importInput" accept=".json,application/json" hidden>
  <script src="app.js?v=42"></script>
</body>
</html>
